name: Nettoyer l'ancienne arborescence

# Lancement MANUEL uniquement. Il faut taper SUPPRIMER pour confirmer.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Tape SUPPRIMER pour confirmer"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: nettoyage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nettoyer:
    name: "Supprimer l'ancienne arborescence"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Vérifier la confirmation
        if: ${{ inputs.confirmation != 'SUPPRIMER' }}
        run: |
          echo "Confirmation incorrecte : rien n'a été supprimé."
          exit 1

      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Supprimer les placeholders, les anciens modules et le workflow de création
        shell: bash
        run: |
          set -euo pipefail

          # 1. Supprime uniquement les README.md dont le contenu est exactement « DSI ».
          #    Un README avec du vrai contenu n'est jamais touché.
          find . -path ./.git -prune -o -type f -name README.md -print0 |
            while IFS= read -r -d '' f; do
              if [ "$(tr -d '\r\n' < "$f")" = "DSI" ]; then
                git rm -q "$f"
              fi
            done

          # 2. Supprime les anciens modules s'ils ne contiennent plus rien.
          #    Si un vrai fichier reste dedans, le dossier est conservé.
          for d in core data domain feature build-logic app/src/main/kotlin/bf; do
            [ -d "$d" ] && find "$d" -type d -empty -delete
          done

          # 3. Supprime le workflow qui recréait l'ancienne arborescence.
          [ -f .github/workflows/arborescence.yml ] && git rm -q .github/workflows/arborescence.yml || true

          # 4. Commit uniquement s'il y a des changements.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Rien à supprimer."
            exit 0
          fi
          git commit -qm "Supprime l'ancienne arborescence (placeholders README)"
          git push