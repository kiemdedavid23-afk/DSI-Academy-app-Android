name: Formater le code (ktlint)

# Corrige AUTOMATIQUEMENT la mise en forme (imports, virgules, retours à la ligne).
# Ne change pas le comportement du code. Lancement manuel.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  formater:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Formater
        run: |
          if [ ! -f .editorconfig ]; then
            echo "Le fichier .editorconfig est introuvable à la racine : arrêt."
            exit 1
          fi
          curl -sSL -o "$RUNNER_TEMP/ktlint" "https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint"
          chmod +x "$RUNNER_TEMP/ktlint"
          "$RUNNER_TEMP/ktlint" --format "app/src/**/*.kt" || true
      - name: Enregistrer les changements
        run: |
          git config user.name "dsi-format-bot"
          git config user.email "dsi-format-bot@users.noreply.github.com"
          git add app/src
          if git diff --cached --quiet; then
            echo "Rien à changer."
          else
            git commit -m "Mise en forme automatique (ktlint)"
            git push
          fi