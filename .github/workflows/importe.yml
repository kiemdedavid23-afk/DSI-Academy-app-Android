name: Importer l'archive du projet

# Mode d'emploi :
#   1. Sur GitHub : Releases → Draft a new release → crée un tag (ex. import-1)
#      → joins ton fichier .zip → Publish release (PAS en brouillon).
#   2. Copie le lien du fichier .zip dans la Release (appui long → copier l'adresse du lien).
#      Il ressemble à : https://github.com/PROPRIETAIRE/DEPOT/releases/download/import-1/projet.zip
#   3. Actions → « Importer l'archive du projet » → Run workflow → colle le lien → Run.
#
# Ce qu'il fait :
#   1. télécharge l'archive depuis la Release de CE dépôt (les autres adresses sont refusées) ;
#   2. dézippe ;
#   3. retire le dossier enveloppe (ex. DSI-Academy-app-Android-main/) s'il y en a un ;
#   4. copie tout à la racine du dépôt, aux bons emplacements ;
#   5. commite et pousse.
#
# Jamais importés (retirés ou ignorés) :
#   .git, .github (GitHub interdit à ce workflow de modifier les workflows), import/, __MACOSX,
#   .DS_Store, dossiers build/, .gradle/, .idea/, .kotlin/, fichiers *.iml et *.zip,
#   et les fichiers sensibles : *.jks, *.keystore, keystore.properties, local.properties.
#
# Deux modes :
#   fusion    (défaut) : ajoute et remplace, ne supprime rien.
#   remplacer : le dépôt devient une copie exacte de l'archive (les fichiers absents de l'archive
#               sont supprimés), sauf .github et import/ qui restent intacts.
on:
  workflow_dispatch:
    inputs:
      lien:
        description: "https://github.com/kiemdedavid23-afk/DSI-Academy-app-Android/releases/download/Bo/DSI-Academy-Android-COMPLET.zip"
        type: string
        required: true
      mode:
        description: "fusion (ajoute / remplace) ou remplacer (copie exacte de l'archive)"
        type: choice
        options:
          - fusion
          - remplacer
        default: fusion

permissions:
  contents: write

concurrency:
  group: importer-archive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  importer:
    name: "Dézipper, ranger et commiter"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Dézipper et ranger
        shell: bash
        env:
          LIEN: ${{ inputs.lien }}
          MODE: ${{ inputs.mode || 'fusion' }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          RESUME="${GITHUB_STEP_SUMMARY:-/dev/null}"
          WORK="${RUNNER_TEMP:-/tmp}/import"

          echo "### Import de l'archive" >> "$RESUME"

          fail() {
            echo "::error::$1"
            echo "- ❌ $1" >> "$RESUME"
            exit 1
          }

          case "$MODE" in
            fusion|remplacer) ;;
            *) fail "Mode inconnu : '$MODE' (attendu : fusion ou remplacer)." ;;
          esac

          # ── 1. Télécharger l'archive depuis la Release ─────────
          LIEN="$(printf '%s' "$LIEN" | tr -d '[:space:]')"
          PREFIXE="https://github.com/${REPO}/releases/download/"
          if [[ "${LIEN,,}" != "${PREFIXE,,}"* ]]; then
            fail "Le lien doit commencer par ${PREFIXE} (une Release de CE dépôt)."
          fi
          reste="${LIEN:${#PREFIXE}}"
          if ! [[ "$reste" =~ ^([A-Za-z0-9._-]+)/([A-Za-z0-9._-]+\.zip)$ ]]; then
            fail "Lien invalide : attendu ${PREFIXE}<tag>/<fichier>.zip (tag et nom de fichier : lettres, chiffres, . _ - seulement)."
          fi
          TAG="${BASH_REMATCH[1]}"
          FICHIER="${BASH_REMATCH[2]}"

          mkdir -p "$WORK/dl"
          if ! gh release download "$TAG" --repo "$REPO" --pattern "$FICHIER" --dir "$WORK/dl" --clobber; then
            fail "Téléchargement impossible : vérifie que la Release « $TAG » est PUBLIÉE (pas en brouillon) et que le fichier $FICHIER y est joint."
          fi
          ZIP="$WORK/dl/$FICHIER"
          if [ ! -s "$ZIP" ]; then
            fail "Le fichier téléchargé est vide ou absent."
          fi
          echo "Archive : $FICHIER (Release $TAG, mode $MODE)"
          echo "- Archive : \`$FICHIER\` (Release \`$TAG\`) — mode **$MODE**" >> "$RESUME"

          # ── 2. Dézipper dans un dossier temporaire ─────────────
          rm -rf "$WORK/raw"
          mkdir -p "$WORK/raw"
          unzip -q "$ZIP" -d "$WORK/raw"
          rc=$?
          if [ "$rc" -gt 1 ]; then
            fail "Archive illisible ou corrompue (code unzip $rc)."
          fi
          rm -rf "$WORK/raw/__MACOSX"
          find "$WORK/raw" -name '.DS_Store' -delete

          nb_liens="$(find "$WORK/raw" -type l | wc -l)"
          if [ "$nb_liens" -gt 0 ]; then
            find "$WORK/raw" -type l -delete
            echo "::warning::$nb_liens lien(s) symbolique(s) ignoré(s)."
            echo "- ⚠️ $nb_liens lien(s) symbolique(s) ignoré(s)" >> "$RESUME"
          fi

          # ── 3. Retirer le dossier enveloppe ────────────────────
          mapfile -t tops < <(find "$WORK/raw" -mindepth 1 -maxdepth 1)
          if [ "${#tops[@]}" -eq 0 ]; then
            fail "L'archive est vide."
          fi
          SRC="$WORK/raw"
          if [ "${#tops[@]}" -eq 1 ] && [ -d "${tops[0]}" ]; then
            nom_top="$(basename "${tops[0]}")"
            case "$nom_top" in
              app|docs|gradle|build-logic|inbox|import|.github) ;;   # vrai dossier du projet : on ne le retire pas
              *)
                SRC="${tops[0]}"
                echo "Dossier enveloppe retiré : $nom_top"
                echo "- Dossier enveloppe retiré : \`$nom_top\`" >> "$RESUME"
                ;;
            esac
          fi

          # ── 4. Vérifier que c'est bien le projet ───────────────
          if [ ! -d "$SRC/app" ] && [ ! -d "$SRC/docs" ] && [ ! -d "$SRC/gradle" ] && [ ! -f "$SRC/settings.gradle.kts" ]; then
            fail "Cette archive ne ressemble pas au projet Android (ni app/, ni docs/, ni gradle/, ni settings.gradle.kts)."
          fi

          # ── 5. Fichiers sensibles et fichiers trop gros ────────
          mapfile -t sensibles < <(find "$SRC" -type f \( -name '*.jks' -o -name '*.keystore' -o -name 'keystore.properties' -o -name 'local.properties' \))
          for s in "${sensibles[@]}"; do
            rm -f "$s"
            echo "::warning::Fichier sensible non importé : ${s#"$SRC"/}"
            echo "- ⚠️ Fichier sensible **non importé** : \`${s#"$SRC"/}\`" >> "$RESUME"
          done
          gros="$(find "$SRC" -type f -size +95M | head -3 | tr '\n' ' ')"
          if [ -n "$gros" ]; then
            fail "Fichier(s) de plus de 95 Mo (limite GitHub 100 Mo) : $gros"
          fi

          # ── 6. Copier à la racine du dépôt ─────────────────────
          # D'abord on retire de la copie temporaire tout ce qui ne doit jamais être importé.
          if [ -d "$SRC/.github" ]; then
            echo "::warning::.github/ de l'archive ignoré (GitHub interdit à ce workflow de toucher aux workflows : ajoute-les à la main)."
            echo "- ⚠️ \`.github/\` de l'archive **ignoré** : ajoute les workflows à la main" >> "$RESUME"
          fi
          rm -rf "$SRC/.git" "$SRC/.github" "$SRC/import"
          find "$SRC" -type d \( -name build -o -name .gradle -o -name .idea -o -name .kotlin -o -name __MACOSX \) -prune -exec rm -rf {} +
          find "$SRC" -type f \( -name '*.iml' -o -name '*.zip' -o -name '.DS_Store' \) -delete

          # Mode remplacer : on supprime du dépôt les fichiers suivis qui ne sont plus dans l'archive
          # (.github et import/ sont protégés).
          if [ "$MODE" = "remplacer" ]; then
            while IFS= read -r -d '' f; do
              case "$f" in
                .github/*|import/*) continue ;;
              esac
              if [ ! -e "$SRC/$f" ]; then
                rm -f -- "$f"
              fi
            done < <(git ls-files -z)
            find . -mindepth 1 -type d -empty -not -path './.git/*' -not -path './.git' -delete
          fi

          # Copie : les dossiers sont fusionnés, les fichiers de même chemin sont remplacés.
          if ! cp -a "$SRC"/. ./; then
            fail "La copie des fichiers a échoué."
          fi

          # ── 7. Préparer le commit, régler gradlew ──────────────
          git add -A
          if [ -f gradlew ]; then
            git add --chmod=+x gradlew
          fi

          # ── 8. Commiter et pousser ─────────────────────────────
          if git diff --cached --quiet; then
            echo "Rien à changer : le dépôt contient déjà exactement ces fichiers."
            echo "- Rien à changer." >> "$RESUME"
            exit 0
          fi

          ajoutes="$(git diff --cached --name-status | grep -c '^A' || true)"
          modifies="$(git diff --cached --name-status | grep -c '^M' || true)"
          supprimes="$(git diff --cached --name-status | grep -c '^D' || true)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git commit -qm "chore(import): importe $(basename "$ZIP") (mode $MODE)"; then
            fail "Le commit a échoué."
          fi
          if ! git push origin "HEAD:$BRANCH"; then
            echo "Push refusé (la branche a bougé) : nouvelle tentative après mise à jour."
            if ! { git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; }; then
              fail "Impossible de pousser l'import. Relance le workflow."
            fi
          fi

          echo "Import terminé : $ajoutes ajouté(s), $modifies modifié(s), $supprimes supprimé(s)."
          {
            echo ""
            echo "**Import terminé sur \`$BRANCH\`** : $ajoutes fichier(s) ajouté(s), $modifies modifié(s), $supprimes supprimé(s)."
          } >> "$RESUME"