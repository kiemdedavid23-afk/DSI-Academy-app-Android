name: Vérifications DSI Android

# Ce workflow VÉRIFIE le code. Il ne construit ni APK ni application.
# UN SEUL job, UN SEUL journal : ouvre la dernière étape « RAPPORT À COPIER » et copie tout.
# Lancement MANUEL : Actions → « Vérifications DSI Android » → Run workflow.
#   etape     : jusqu'où vérifier (cumulatif : « 3 » exécute aussi 1 et 2).
#   perimetre : « tout » (tout le code) ou « dernier-commit » (seulement les .kt du dernier commit,
#               pratique pour contrôler la livraison de Grok sans le bruit de l'ancien code).
# Toutes les étapes demandées s'exécutent même si une précédente échoue.
# Étape 3 : les tests unitaires. Gradle doit lire le code pour les lancer : une erreur de code
# apparaît donc ici aussi, mais aucun APK n'est jamais construit.
on:
  workflow_dispatch:
    inputs:
      etape:
        description: "Jusqu'à quelle étape vérifier ?"
        type: choice
        default: "1-controles-rapides"
        options:
          - "1-controles-rapides"
          - "2-qualite"
          - "3-tests"
      perimetre:
        description: "Périmètre des contrôles de l'étape 1 (règles de code)"
        type: choice
        default: "tout"
        options:
          - "tout"
          - "dernier-commit"

permissions:
  contents: read

concurrency:
  group: verifications-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  KTLINT_VERSION: "1.5.0"
  DETEKT_VERSION: "1.23.7"

jobs:
  verification:
    name: "Vérification complète"
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: "1 · Règles de code"
        id: s1
        continue-on-error: true
        shell: bash
        env:
          PERIMETRE: ${{ inputs.perimetre }}
        run: |
          set -uo pipefail
          set +e
          mkdir -p "$RUNNER_TEMP/rapport"
          exec > >(tee "$RUNNER_TEMP/rapport/1-regles.log") 2>&1
          ERR=0
          for f in docs/ARCHITECTURE.md docs/CONTRATS-API.md docs/DESIGN-TOKENS.md; do
            if [ ! -f "$f" ]; then
              echo "::error title=Document manquant::$f est obligatoire."
              echo "✗ Document manquant : $f"
              ERR=1
            fi
          done
          ROOT="app/src/main/kotlin/app/dsiacademy/academy"
          P='app\.dsiacademy\.academy'
          RES="${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "### Contrôles de l'étape 1 (périmètre : ${PERIMETRE:-tout})" >> "$RES"

          # ── Liste des fichiers .kt du code principal ─────────────
          ALL=$(find app/src/main/kotlin -name '*.kt' -type f 2>/dev/null | sort)
          if [ "${PERIMETRE:-tout}" = "dernier-commit" ]; then
            CH=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
            ALL=$(printf '%s\n' "$ALL" | grep -Fx -f <(printf '%s\n' "$CH") || true)
            echo "Périmètre : dernier commit ($(printf '%s\n' "$ALL" | grep -c . || true) fichier(s) .kt)"
          fi

          # Fichiers situés sous $ROOT/<dossier>/ (un ou plusieurs dossiers)
          under() {
            local pat="" d
            for d in "$@"; do pat="$pat|^$ROOT/$d/"; done
            printf '%s\n' "$ALL" | grep -E "${pat#|}" || true
          }
          # Retire les lignes de commentaires (//, /*, *)
          sans_commentaires() { grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|/\*|\*)' || true; }

          report() {
            local titre="$1" out="$2"
            if [ -n "$out" ]; then
              ERR=1
              local n; n=$(printf '%s\n' "$out" | wc -l)
              echo "::error title=$titre::$n violation(s)"
              echo "✗ $titre ($n)"
              printf '%s\n' "$out" | head -15 | sed "s#$ROOT/#   #"
              echo "- ❌ $titre : $n" >> "$RES"
            fi
          }
          # scan TITRE REGEX DOSSIERS...
          scan() {
            local titre="$1" re="$2"; shift 2
            local f; f=$(under "$@"); [ -z "$f" ] && return 0
            report "$titre" "$(printf '%s\n' "$f" | xargs -r grep -nHE -e "$re" 2>/dev/null | sans_commentaires)"
          }
          # Idem, mais la ligne peut porter la dérogation « dsi-allow-literal »
          scan_lit() {
            local titre="$1" re="$2"; shift 2
            local f; f=$(under "$@"); [ -z "$f" ] && return 0
            report "$titre" "$(printf '%s\n' "$f" | xargs -r grep -nHE -e "$re" 2>/dev/null | sans_commentaires | grep -v 'dsi-allow-literal' || true)"
          }
          # imports de notre paquet qui ne sont PAS dans la liste autorisée
          # scan_imports TITRE AUTORISÉS_REGEX DOSSIERS...
          scan_imports() {
            local titre="$1" ok="$2"; shift 2
            local f; f=$(under "$@"); [ -z "$f" ] && return 0
            report "$titre" "$(printf '%s\n' "$f" | xargs -r grep -nHE -e "^import +$P\." 2>/dev/null | grep -vE "import +$P\.($ok)" || true)"
          }

          # ── 1. feature ───────────────────────────────────────────
          scan "feature importe data" "^import +$P\.data\." feature
          scan "feature importe API / DTO / mapper / local" "^import +$P\..*\.(dto|api|mapper|local)\." feature
          scan "feature importe réseau ou disque" '^import +(retrofit2|okhttp3|androidx\.room|androidx\.datastore)' feature
          for d in $(under feature | sed -E "s#^$ROOT/feature/([^/]+)/.*#\1#" | sort -u); do
            out=$(under "feature/$d" | xargs -r grep -nHE "^import +$P\.feature\." 2>/dev/null | grep -vE "$P\.feature\.$d\." || true)
            report "feature « $d » importe une autre feature" "$out"
          done

          # ── 2. domain (Kotlin pur, ne voit que core.common) ──────
          scan "domain non pur (Android, réseau, JSON, injection)" '^import +(android\.|androidx\.|retrofit2|okhttp3|kotlinx\.serialization|com\.google\.|javax\.inject|dagger)' domain
          scan_imports "domain dépend d'autre chose que domain et core.common" "(domain|core\.common)\." domain

          # ── 3. core ──────────────────────────────────────────────
          scan_imports "core.common dépend d'autre chose que lui-même" "core\.common\." core/common
          scan "core importe domain / data / feature / navigation / di" "^import +$P\.(domain|data|feature|navigation|di)\." core
          scan "core.common non pur (android)" '^import +(android\.|androidx\.)' core/common

          # ── 4. data ──────────────────────────────────────────────
          scan "data importe feature / navigation / di" "^import +$P\.(feature|navigation|di)\." data

          # ── 5. session : jamais de 401 hors intercepteur central ─
          scan "401 testé hors de core/network" '\b401\b' data feature domain

          # ── 6. URLs de Workers : jamais en dur dans le code ──────
          scan "URL workers.dev en dur" 'workers\.dev' core data domain feature navigation di

          # ── 7. coroutines interdites ─────────────────────────────
          scan "GlobalScope ou runBlocking" '\b(GlobalScope|runBlocking)\b' core data domain feature navigation di

          # ── 8. valeurs visuelles et textes en dur dans feature ───
          scan_lit "couleur en dur" 'Color\(\s*(0x|[0-9])' feature
          scan_lit "couleur nommée en dur" '\bColor\.(Red|Green|Blue|Yellow|Cyan|Magenta|White|Black|Gray|DarkGray|LightGray)\b' feature
          scan_lit "taille de police en dur" '(fontSize|lineHeight|letterSpacing)\s*=\s*[0-9]|[0-9]\.sp\b' feature
          scan_lit "espacement ou taille en dur" '[0-9]\.dp\b|\([0-9]+\s*\.dp\)' feature
          scan_lit "texte en dur" '\bText\(\s*(text\s*=\s*)?"|contentDescription\s*=\s*"' feature

          # ── 9. routes Retrofit : uniquement celles de CONTRATS-API.md ─
          CONTRAT_F=$(mktemp)
          sed -E 's/\{[^}]*\}/{}/g' docs/CONTRATS-API.md > "$CONTRAT_F"
          INVENTEES=""
          while read -r m p; do
            [ -z "${m:-}" ] && continue
            p="${p%%\?*}"; p="/${p#/}"
            p=$(printf '%s' "$p" | sed -E 's/\{[^}]*\}/{}/g')
            re=$(printf '%s' "$m $p" | sed -E 's/[][\.*^$(){}|+?]/\\&/g')
            if ! grep -qE "${re}(\?|[^A-Za-z0-9_{}/.-]|$)" "$CONTRAT_F"; then
              INVENTEES="$INVENTEES$m $p"$'\n'
            fi
          done < <(grep -rhoE '@(GET|POST|PUT|DELETE|PATCH)\("[^"]*"' app/src/main/kotlin 2>/dev/null \
                    | sed -E 's/@([A-Z]+)\("/\1 /; s/"$//' | sort -u)
          report "route Retrofit absente de CONTRATS-API.md" "$(printf '%s' "$INVENTEES")"

          # ── 10. strings.xml : chaque clé FR a son EN, et inversement ─
          FR=app/src/main/res/values/strings.xml
          EN=app/src/main/res/values-en/strings.xml
          if [ -f "$FR" ] && [ -f "$EN" ]; then
            noms() { grep -oE '<string name="[^"]+"' "$1" | sed -E 's/.*name="//; s/"$//' | sort -u; }
            report "strings.xml : clé FR sans traduction EN" "$(comm -23 <(noms "$FR") <(noms "$EN"))"
            report "strings.xml : clé EN sans équivalent FR" "$(comm -13 <(noms "$FR") <(noms "$EN"))"
          fi

          # ── 11. secrets et fichiers de clés ──────────────────────
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            secrets=$(git grep -nIE -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' -e 'AIza[0-9A-Za-z_-]{30,}' -e 'sk-[A-Za-z0-9]{32,}' -- . ':!docs' 2>/dev/null | cut -d: -f1,2 || true)
            report "secret détecté (contenu masqué)" "$secrets"
            fichiers=$(git ls-files | grep -E '\.(jks|keystore)$|(^|/)keystore\.properties$|(^|/)local\.properties$' || true)
            report "fichier de clés ou de configuration locale versionné" "$fichiers"
          fi

          # ── Avertissements (non bloquants) ───────────────────────
          nb=$(printf '%s\n' "$ALL" | xargs -r grep -nE '!!' 2>/dev/null | sans_commentaires | wc -l)
          [ "${nb:-0}" -gt 0 ] && echo "::warning title=Opérateur !!::$nb occurrence(s) : chacune doit être justifiée"
          nbtodo=$(printf '%s\n' "$ALL" | xargs -r grep -nE 'TODO|FIXME' 2>/dev/null | wc -l)
          [ "${nbtodo:-0}" -gt 0 ] && echo "::warning title=TODO / FIXME::$nbtodo occurrence(s) restante(s)"
          sans_test=""
          for vm in $(printf '%s\n' "$ALL" | grep 'ViewModel\.kt$' || true); do
            n=$(basename "$vm" .kt)
            [ -z "$(find app/src/test -name "${n}Test.kt" 2>/dev/null)" ] && sans_test="$sans_test $n"
          done
          [ -n "$sans_test" ] && echo "::warning title=ViewModel sans test::$sans_test"

          if [ $ERR -ne 0 ]; then
            echo ""
            echo "ÉCHEC : règles non respectées (voir docs/ARCHITECTURE.md §0, §14, §16)."
            exit 1
          fi
          echo "✓ Toutes les règles de l'étape 1 sont respectées."

      - name: Installer Java
        if: ${{ inputs.etape == '2-qualite' || inputs.etape == '3-tests' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: "2a · Qualité : ktlint"
        id: ktlint
        if: ${{ inputs.etape == '2-qualite' || inputs.etape == '3-tests' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rapport"
          if [ ! -f .editorconfig ]; then
            printf '%s\n' 'root = true' '' '[*.{kt,kts}]' \
              'ktlint_code_style = android_studio' \
              'ktlint_function_naming_ignore_when_annotated_with = Composable' \
              'max_line_length = 140' > .editorconfig
          fi
          curl -sSL -o ktlint "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x ktlint
          ./ktlint --relative "app/src/**/*.kt" --reporter=plain 2>&1 | tee "$RUNNER_TEMP/rapport/2-ktlint.log"

      - name: "2b · Qualité : detekt"
        id: detekt
        if: ${{ inputs.etape == '2-qualite' || inputs.etape == '3-tests' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rapport"
          printf '%s\n' \
            'naming:' \
            '  FunctionNaming:' \
            "    ignoreAnnotated: ['Composable']" \
            '  InvalidPackageDeclaration:' \
            '    active: false' \
            'complexity:' \
            '  LongMethod:' \
            "    ignoreAnnotated: ['Composable']" \
            '  LongParameterList:' \
            "    ignoreAnnotated: ['Composable']" \
            '  CyclomaticComplexMethod:' \
            "    ignoreAnnotated: ['Composable']" \
            '  TooManyFunctions:' \
            '    active: false' \
            'style:' \
            '  MagicNumber:' \
            '    active: false' \
            '  MaxLineLength:' \
            '    maxLineLength: 140' \
            '  ReturnCount:' \
            '    active: false' \
            '  UnusedPrivateMember:' \
            "    ignoreAnnotated: ['Preview']" > /tmp/detekt.yml
          curl -sSL -o detekt.jar "https://github.com/detekt/detekt/releases/download/v${DETEKT_VERSION}/detekt-cli-${DETEKT_VERSION}-all.jar"
          java -jar detekt.jar --input app/src --config /tmp/detekt.yml --build-upon-default-config 2>&1 | tee "$RUNNER_TEMP/rapport/2-detekt.log"

      - name: Installer Gradle
        if: ${{ inputs.etape == '3-tests' }}
        uses: gradle/actions/setup-gradle@v4

      - name: "3 · Tests unitaires et contrats"
        id: s3
        if: ${{ inputs.etape == '3-tests' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rapport"
          if [ ! -f gradlew ]; then
            echo "gradlew introuvable : impossible de lancer les tests." | tee "$RUNNER_TEMP/rapport/3-tests.log"
            exit 1
          fi
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/rapport/3-tests.log"

      - name: "RAPPORT À COPIER (ouvre cette étape et copie tout)"
        if: ${{ always() }}
        shell: bash
        env:
          S1_OUTCOME: ${{ steps.s1.outcome }}
          KTLINT_OUTCOME: ${{ steps.ktlint.outcome }}
          DETEKT_OUTCOME: ${{ steps.detekt.outcome }}
          S3_OUTCOME: ${{ steps.s3.outcome }}
          PERIMETRE: ${{ inputs.perimetre }}
        run: |
          set -uo pipefail
          set +e
          D="$RUNNER_TEMP/rapport"
          mkdir -p "$D"
          etat() {
            case "$1" in
              success) echo "OK" ;;
              failure) echo "ÉCHEC" ;;
              skipped|"") echo "non demandé" ;;
              cancelled) echo "annulé" ;;
              *) echo "$1" ;;
            esac
          }
          S2="$KTLINT_OUTCOME"
          if [ "$DETEKT_OUTCOME" = "failure" ] || [ "$KTLINT_OUTCOME" = "failure" ]; then S2="failure"; fi
          if [ -z "$KTLINT_OUTCOME$DETEKT_OUTCOME" ] || { [ "$KTLINT_OUTCOME" = "skipped" ] && [ "$DETEKT_OUTCOME" = "skipped" ]; }; then S2="skipped"; fi
          R="$D/RAPPORT.txt"
          {
            echo "===== RAPPORT DE VÉRIFICATION — copie tout depuis cette ligne ====="
            echo "Branche : ${GITHUB_REF_NAME:-?}   Commit : ${GITHUB_SHA:-?}"
            echo "Périmètre des règles : ${PERIMETRE:-tout}"
            echo ""
            echo "Étape 1 · règles de code : $(etat "$S1_OUTCOME")"
            echo "Étape 2 · qualité        : $(etat "$S2")   (ktlint : $(etat "$KTLINT_OUTCOME") · detekt : $(etat "$DETEKT_OUTCOME"))"
            echo "Étape 3 · tests          : $(etat "$S3_OUTCOME")"

            if [ "$S1_OUTCOME" = "failure" ] && [ -f "$D/1-regles.log" ]; then
              echo ""
              echo "----- DÉTAIL ÉTAPE 1 (règles) -----"
              grep -v '^::' "$D/1-regles.log" | head -200
            fi

            if [ "$KTLINT_OUTCOME" = "failure" ] && [ -f "$D/2-ktlint.log" ]; then
              n=$(grep -c '\.kt:[0-9]' "$D/2-ktlint.log" || true)
              echo ""
              echo "----- DÉTAIL ÉTAPE 2 · ktlint ($n problème(s), 40 premiers) -----"
              grep '\.kt:[0-9]' "$D/2-ktlint.log" | head -40
              [ "$n" -eq 0 ] && tail -15 "$D/2-ktlint.log"
            fi

            if [ "$DETEKT_OUTCOME" = "failure" ] && [ -f "$D/2-detekt.log" ]; then
              n=$(grep -c '\.kt:[0-9]' "$D/2-detekt.log" || true)
              echo ""
              echo "----- DÉTAIL ÉTAPE 2 · detekt ($n problème(s), 40 premiers) -----"
              grep '\.kt:[0-9]' "$D/2-detekt.log" | head -40
              [ "$n" -eq 0 ] && tail -15 "$D/2-detekt.log"
            fi

            if [ "$S3_OUTCOME" = "failure" ] && [ -f "$D/3-tests.log" ]; then
              echo ""
              echo "----- DÉTAIL ÉTAPE 3 (tests) -----"
              if grep -q '^e: ' "$D/3-tests.log"; then
                echo "Erreurs de code (le projet ne se lit pas) :"
                grep '^e: ' "$D/3-tests.log" | sed 's#file:///[^ ]*/app/#app/#' | head -60
              fi
              grep -E 'tests completed|FAILED$|AssertionError|Test.*FAILED' "$D/3-tests.log" | head -40
              sed -n '/\* What went wrong:/,/\* Try:/p' "$D/3-tests.log" | head -40
            fi

            echo ""
            echo "===== FIN DU RAPPORT ====="
          } > "$R"

          cat "$R"
          { echo '```'; cat "$R"; echo '```'; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

          BAD=0
          for o in "$S1_OUTCOME" "$KTLINT_OUTCOME" "$DETEKT_OUTCOME" "$S3_OUTCOME"; do
            [ "$o" = "failure" ] && BAD=1
          done
          exit $BAD